<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes</title>
    <link rel="stylesheet" href="Slider.css" />
  </head>

  <body>
    <section style="display:flex; justify-content: center;align-items: center;margin: 3em;max-width:80em ;background-color:darkgray;height:30em;">
      <div class="container">
        <div>
          <div id="slides"></div>
          <div id="slider"></div>
        </div>
        <div class="btn">
          <button onclick="handlePrevious()" id="prev-btn">Previous</button>
          <button onclick="handleNext()" id="next-btn">Next</button>
        </div>
      </div>
    </section>
    <script>
      const data = [
        {
          src: '<img  src="./picturee/Mathematics.jpeg" alt="">',
          text: "This picture is a mathematics, Maths is a subject every student if scared bbbbbbbbbb bbbbbbb bbbggggggg",
        },
        {
          src: '<img  src="./picturee/Maths2.jpg" alt=" ">',
          text: "Kunle is cooking",
        },
        {
          src: '<img  src="./picturee/DesMaths.jpeg" alt=" ">',
          text: "Chelsea is a foolish club",
        },
      ];

      let currentIndex = 0;
      slides.innerHTML = data[currentIndex].src;
      slider.innerHTML = data[currentIndex].text;

      function handleNext() {
        currentIndex = currentIndex += 1;
        slides.innerHTML = data[currentIndex].src;
        slider.innerHTML = data[currentIndex].text;
      }

      function handlePrevious() {
        currentIndex = currentIndex -= 1;
        slides.innerHTML = data[currentIndex].src;
        slider.innerHTML = data[currentIndex].text;
      }
    </script>
  </body>
</html>
